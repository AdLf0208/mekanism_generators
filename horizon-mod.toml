id = "mekanismgenerators"
name = "Mekanism: Generators"
version = "0.2.0"
description = """A port of Mekanism: Generators for Horizon, slice 1: the Heat Generator. One block
whose fuel slot turns burnable items into lava, a 24,000 mB lava tank, a heat capacitor fed by the
burning lava, the lava beside it and an ultrawarm dimension, and a 160,000 FE buffer filled by the
Carnot conversion of the heat the capacitor loses (112 FE/t on coal, 96 on six lava sides, 39 in
the Nether). The buffer is a real block energy capability another mod's cable can drain. Not yet
ported: the other generators, the reactors and turbine, the fluid capability, the GUI and the
`active` model."""
authors = ["Aidan C. Brady", "AdLf0208"]
license = "MIT"
homepage = "https://github.com/AdLf0208/mekanismgenerators"
issues = "https://github.com/mekanism/Mekanism/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins,
# beside the carried data/ and assets/. The id is the resource namespace and the only identity:
# Cargo's package name and version are not the mod's.
api = "0.2"
# "both" is the installation side, not a hook's: the generator runs on the server, and a LAN host
# or single-player world runs it inside the client installation.
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity
# types"); this mod declares a block, so the capability is used, not just required.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
